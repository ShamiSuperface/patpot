    var parts = path.split('.'), v = scope;

      return;
    }
    var el = document.createElementNS(node.namespaceURI || 'http://www.w3.org/1999/xhtml', tag);
    var h = {};
    for (var j = 0; j < node.attributes.length; j++) {
      var a = node.attributes[j], n = a.name, ln = n.toLowerCase();
      if (ln.indexOf('hint-') === 0) continue;
      if (EVT[ln]) { var hp = whole(a.value), fn = hp ? get(scope, hp) : null; if (typeof fn === 'function') h[EVT[ln]] = fn; continue; }
      var wp = whole(a.value), val = wp ? get(scope, wp) : interp(a.value, scope);
      if (val === false || val == null) continue;
      if (val === true) val = '';

    el.__h = h;
    var sub = []; kids(node, scope, sub);

  function bindEl(el) {
    if (!el.__h) return;
