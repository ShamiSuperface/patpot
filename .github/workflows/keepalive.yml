name: Supabase keepalive

# Supabase free projects pause after a week without activity.
# This pings the database once a day so Patpot stays awake.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            "https://twpptxxesvjidnaeldqe.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_8WYlm3FQo8iXPz98v3gh9w_C2UuqEuX" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
